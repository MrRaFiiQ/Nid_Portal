name: Auto Unzip

on:
  push:
    paths:
      - "**.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find ZIP file
        id: find_zip
        shell: bash
        run: |
          echo "Searching for ZIP files..."

          ZIP_FILE=$(find . \
            -type f \
            \( -iname "*.zip" \) \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            echo "Files in repository:"
            find . -maxdepth 3 -type f | head -100
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Check ZIP
        shell: bash
        run: |
          echo "Testing ZIP:"
          unzip -t "$ZIP_FILE"

      - name: Extract ZIP
        shell: bash
        run: |
          rm -rf extracted
          mkdir -p extracted

          echo "Extracting:"
          echo "$ZIP_FILE"

          unzip -o "$ZIP_FILE" -d extracted

          echo "Extraction completed."

      - name: Show extracted files
        shell: bash
        run: |
          echo "Extracted files:"
          find extracted -maxdepth 4 -type f | head -200

      - name: Move project files
        shell: bash
        run: |
          shopt -s dotglob nullglob

          items=(extracted/*)

          if [ ${#items[@]} -eq 0 ]; then
            echo "ERROR: ZIP is empty."
            exit 1
          fi

          for item in "${items[@]}"; do
            name=$(basename "$item")

            # Don't overwrite GitHub workflow directory
            if [ "$name" = ".github" ]; then
              continue
            fi

            rm -rf -- "$name"
            mv -- "$item" .
          done

          rm -rf extracted

      - name: Remove ZIP
        shell: bash
        run: |
          rm -f "$ZIP_FILE"

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Auto extract ZIP"
          git push
