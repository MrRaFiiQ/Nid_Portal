name: Auto Unzip

on:
  push:
    paths:
      - "**.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Find ZIP file
        shell: bash
        run: |
          echo "Searching for ZIP..."

          ZIP_FILE=$(find . \
            -type f \
            -iname "*.zip" \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found."
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Check ZIP
        shell: bash
        run: |
          unzip -t "$ZIP_FILE"

      - name: Extract ZIP
        shell: bash
        run: |
          rm -rf extracted
          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo "Extraction completed."

      - name: Show extracted files
        shell: bash
        run: |
          echo "Large files:"
          find extracted -type f -size +50M -exec ls -lh {} \;

      - name: Move project files
        shell: bash
        run: |
          shopt -s dotglob nullglob

          items=(extracted/*)

          if [ ${#items[@]} -eq 0 ]; then
            echo "ERROR: ZIP is empty."
            exit 1
          fi

          for item in "${items[@]}"; do
            name=$(basename "$item")

            if [ "$name" = ".github" ]; then
              continue
            fi

            rm -rf -- "$name"
            mv -- "$item" .
          done

          rm -rf extracted

      - name: Remove ZIP
        shell: bash
        run: |
          rm -f "$ZIP_FILE"

      - name: Setup Git LFS
        shell: bash
        run: |
          git lfs install

      - name: Track large files with Git LFS
        shell: bash
        run: |
          echo "Finding files larger than 100 MB..."

          find . \
            -type f \
            -size +100M \
            -not -path "./.git/*" \
            -print0 |
          while IFS= read -r -d '' file; do
            echo "Tracking with LFS: $file"
            git lfs track "$file"
          done

          git add .gitattributes

      - name: Git status
        shell: bash
        run: |
          git status --short

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Auto extract ZIP and store large files with Git LFS"

          git lfs push --all origin HEAD

          git push origin HEAD
